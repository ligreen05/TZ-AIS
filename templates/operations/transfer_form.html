{% extends "base.html" %}
{% block title %}Новое перемещение{% endblock %}
{% block content %}
<h1>Новое внутреннее перемещение</h1>

<form method="post" class="form-card">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="form-row">
        <label>Дата *
            <input type="date" name="doc_date" value="{{ today }}" required>
        </label>
        <label>Склад *
            <select name="warehouse_id" required>
                {% for w in warehouses %}<option value="{{ w.id }}">{{ w.name }}</option>{% endfor %}
            </select>
        </label>
    </div>
    <label>Комментарий
        <input type="text" name="comment">
    </label>

    <h3>Позиции документа</h3>
    <table class="grid" id="items">
        <thead>
        <tr><th>Товар</th><th>Откуда</th><th>Куда</th><th>Кол-во</th><th></th></tr>
        </thead>
        <tbody>
        <tr>
            <td>
                <select name="product_id[]">
                    {% for p in products %}<option value="{{ p.id }}">{{ p.sku }} — {{ p.name }}</option>{% endfor %}
                </select>
            </td>
            <td>
                <select name="from_location_id[]">
                    {% for l in locations %}<option value="{{ l.id }}">{{ l.warehouse.name }} / {{ l.code }}</option>{% endfor %}
                </select>
            </td>
            <td>
                <select name="to_location_id[]">
                    {% for l in locations %}<option value="{{ l.id }}">{{ l.warehouse.name }} / {{ l.code }}</option>{% endfor %}
                </select>
            </td>
            <td><input type="number" step="0.001" name="quantity[]" required></td>
            <td><button type="button" class="btn-remove" onclick="removeRow(this)">✕</button></td>
        </tr>
        </tbody>
    </table>
    <button type="button" class="btn btn-secondary" onclick="addRow('items')">+ Добавить строку</button>

    <div class="form-actions">
        <button type="submit" class="btn">Провести перемещение</button>
        <a class="btn btn-secondary" href="{{ url_for('operations.transfers') }}">Отмена</a>
    </div>
</form>

<script nonce="{{ g.csp_nonce }}">
function addRow(id){const t=document.querySelector('#'+id+' tbody');const r=t.rows[0].cloneNode(true);r.querySelectorAll('input').forEach(i=>i.value='');t.appendChild(r);}
function removeRow(b){const t=b.closest('tbody');if(t.rows.length>1)b.closest('tr').remove();}
</script>
{% endblock %}
